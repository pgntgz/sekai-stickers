version: '3'
services:
  sekai-stickers:
    image: nginx:alpine
    container_name: sekai_stickers_container
    ports:
      - "3000:80"  # 访问 VPS 的 3000 端口（Cloudflare 代理会转发到这里）
    volumes:
      # 挂载构建产物到 Nginx 静态文件目录
      - /home/sekai-stickers/dist:/usr/share/nginx/html:ro
      # 挂载自定义 Nginx 配置
      - /home/sekai-stickers/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    restart: always
    # 限制资源使用（e2-micro 只有 1GB 内存，省着点用）
    deploy:
      resources:
        limits:
          memory: 128M
