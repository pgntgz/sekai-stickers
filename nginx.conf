# Nginx 配置 - 用于 pjsk.pgntgz.top / sticker.pgntgz.top
# 支持 React SPA 路由和 /pjsk 子路径

server {
    listen 80;
    server_name pjsk.pgntgz.top sticker.pgntgz.top localhost;

    # 开启 gzip 压缩，减少传输体积
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;
    gzip_min_length 256;
    gzip_vary on;

    # /pjsk 子路径 —— React 应用的核心路由
    location /pjsk {
        alias /usr/share/nginx/html;
        index index.html;

        # SPA 单页应用路由: 所有未匹配的路径都回落到 index.html
        try_files $uri $uri/ /pjsk/index.html;

        # 静态资源长期缓存（JS/CSS 文件名含 hash，可以放心缓存）
        location ~* \.(js|css|woff2|woff|ttf|eot)$ {
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        # 图片缓存 30 天
        location ~* \.(png|jpg|jpeg|gif|ico|svg|webp)$ {
            expires 30d;
            add_header Cache-Control "public";
        }
    }

    # 根路径重定向到 /pjsk
    location = / {
        return 301 /pjsk;
    }

    # 健康检查端点（可选，方便监控）
    location /health {
        return 200 'OK';
        add_header Content-Type text/plain;
    }
}
